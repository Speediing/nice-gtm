name: Fetch official NiCE wordmark

on:
  push:

jobs:
  fetch-wordmark:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official press-kit asset
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://resources.nice.com/wp-content/uploads/2025/05/nice-new-logo.svg \
            --output nice-wordmark.svg
          file nice-wordmark.svg
          printf 'NICE_WORDMARK_BASE64='
          base64 --wrap=0 nice-wordmark.svg
          printf '\n'
